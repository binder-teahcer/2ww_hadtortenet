<style>

:root{
  --bg:#eceff2;
  --surface:#fafbfc;
  --surface-2:#e0e5ea;
  --ink:#1b222a;
  --muted:#556270;
  --line:#c9d1d9;
  --accent:#254a6b;
  --accent-ink:#ffffff;
  --ok:#1f6b43;
  --ok-bg:#dcefe3;
  --bad:#a63a2b;
  --bad-bg:#f7e0db;
  --mark:#ffe9a6;
  --focus:#1d4ed8;
  --font-ui:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --font-read:Georgia,"Iowan Old Style","Times New Roman",serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12171c; --surface:#1a2128; --surface-2:#242d36; --ink:#e8edf2; --muted:#9aa8b6;
    --line:#33404d; --accent:#8fb8dd; --accent-ink:#0e1a25; --ok:#7fd3a3; --ok-bg:#1b3527;
    --bad:#f0a193; --bad-bg:#3b221d; --mark:#5b4c12; --focus:#8ab4ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171c; --surface:#1a2128; --surface-2:#242d36; --ink:#e8edf2; --muted:#9aa8b6;
  --line:#33404d; --accent:#8fb8dd; --accent-ink:#0e1a25; --ok:#7fd3a3; --ok-bg:#1b3527;
  --bad:#f0a193; --bad-bg:#3b221d; --mark:#5b4c12; --focus:#8ab4ff; color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font:16px/1.55 var(--font-ui);
  padding-block:16px 56px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.wrap{max-width:1080px;margin:0 auto}
h1,h2,h3,p{margin:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button{font:inherit}

/* gombok */
.btn{
  appearance:none;border:1.5px solid var(--accent);background:var(--accent);color:var(--accent-ink);
  font-weight:600;padding:10px 18px;min-height:44px;border-radius:8px;cursor:pointer;
}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* kezdőlap */
.hero{padding:20px 0 8px}
.eyebrow{font-size:.78rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.hero h1{font:700 clamp(2rem,7vw,3.2rem)/1.05 var(--font-read);margin:8px 0 12px;text-wrap:balance}
.lead{max-width:62ch;color:var(--muted);font-size:1.05rem}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin:22px 0}
.step{padding:14px 16px;border-top:3px solid var(--accent);background:var(--surface);min-width:0}
.step b{display:block;margin-bottom:4px}
.step span{color:var(--muted);font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:18px}
.panel h2{font-size:1.05rem;margin-bottom:10px}
.score-row{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.score-big{font:700 1.8rem/1 var(--font-read);font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;margin:6px 0 24px}
.tcard{
  --th:hsl(var(--h) 45% 34%);
  background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;
  display:flex;flex-direction:column;gap:10px;min-width:0;
}
.tcard .dot{width:34px;height:6px;border-radius:3px;background:var(--th)}
.tcard h3{font:700 1.25rem/1.2 var(--font-read)}
.tcard .per{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.tcard .bl{color:var(--muted);font-size:.95rem;flex:1}
.tcard .st{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tcard{--th:hsl(var(--h) 50% 66%)}}
:root[data-theme="dark"] .tcard{--th:hsl(var(--h) 50% 66%)}
.comp{display:grid;gap:10px}
.comp .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.comp .row .bar{grid-column:1/-1}
.comp .n{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem}
.foot{color:var(--muted);font-size:.9rem;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}

/* hadszíntér-oldal */
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:10px}
.meta{font-variant-numeric:tabular-nums;color:var(--muted)}
.meta b{color:var(--ink)}
.thead2{margin:10px 0 14px}
.thead2 h2{font:700 clamp(1.6rem,5vw,2.3rem)/1.1 var(--font-read);margin-top:4px;outline:none}
.notice{background:var(--surface-2);border-radius:8px;padding:10px 14px;margin-bottom:16px;font-size:.95rem}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}

.reading{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.reading h3{font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
.reading p{font:1.08rem/1.8 var(--font-read);margin-bottom:12px}

.sent.hl{background:var(--mark);box-shadow:0 0 0 3px var(--mark)}
.sn{font:700 .62rem/1 var(--font-ui);color:var(--accent);margin-right:2px;vertical-align:super;font-variant-numeric:tabular-nums}
.gloss{border-top:1px solid var(--line);margin-top:8px;padding-top:10px}
.gloss summary{cursor:pointer;font-weight:600;min-height:32px}
.gloss dl{margin:8px 0 0;display:grid;gap:6px;font-size:.95rem}
.gloss dt{font-weight:700}
.gloss dd{margin:0 0 4px;color:var(--muted)}

.task{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;min-width:0}
.task.done{border-color:var(--ok)}
.th{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}
.chip{font-size:.75rem;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.pts{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-size:1.02rem;font-weight:650;margin-bottom:10px;text-wrap:pretty}
.opts{border:0;margin:0;padding:0;min-width:0}
.opt{

  border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg);
}
.opt input,.pill input{accent-color:var(--accent);width:18px;height:18px;margin:2px 0 0;flex:none}
.opt span{flex:1;min-width:0}
.opt:has(input:checked),.pill:has(input:checked){border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.ok,.pill.ok,.oi.ok,.mrow.ok{background:var(--ok-bg);border-color:var(--ok)}
.opt.bad,.pill.bad,.oi.bad,.mrow.bad{background:var(--bad-bg);border-color:var(--bad)}
.mk{font-size:.82rem;white-space:nowrap}
.tf{padding:10px 0;border-top:1px dashed var(--line)}

.tf p{margin-bottom:8px}
.tfopts{display:flex;flex-wrap:wrap;gap:8px}
.pill{

.oi{

.oi .when{grid-column:1/-1;font-size:.85rem;color:var(--muted)}
.mv{display:flex;gap:6px}
.ib{

.ib:hover:not(:disabled){border-color:var(--accent)}
.ib:disabled{opacity:.35;cursor:not-allowed}
.mrow{
  display:grid;gap:6px;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;
  margin-bottom:8px;background:var(--bg);
}
.mrow label{font-weight:600}
.mrow .arr{display:none}
select{
  font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);
  border-radius:8px;padding:9px 10px;min-height:44px;width:100%;

.mrow .ans{font-size:.9rem}
.act{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:12px}
.act:empty{display:none}
.warn{color:var(--bad);font-size:.92rem;font-weight:600}
.fb{outline:none}
.fb:not(:empty){margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.fbh{font-weight:700;margin-bottom:4px}
.fbh.ok{color:var(--ok)} .fbh.bad{color:var(--bad)}
.fb p{margin-bottom:8px}
.fl{margin:0 0 8px;padding-left:1.3rem;display:grid;gap:8px}
.fl .btn{margin-top:4px}
.fl.nolist{list-style:none;padding-left:0}
.when{color:var(--muted);font-size:.9rem}
.result{background:var(--surface);border:2px solid var(--ok);border-radius:12px;padding:18px;margin-top:6px}
.result h3{font:700 1.3rem/1.2 var(--font-read);margin-bottom:6px}
.result .ra{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
@media (min-width:600px){
  .mrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center}
  .mrow .ans{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

const COMPS = ["Információkeresés", "Következtetés", "Szókincs a szövegben", "Állítások értékelése", "Időrendi gondolkodás", "Ok-okozati gondolkodás"];
const KEY = "hadszinterek-nyomaban-v1";
const app = document.getElementById("app");
const $ = (s, r = document) => r.querySelector(s);
const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

let S = load();
let view = null;
let armed = false;

function load() {
  try { const j = localStorage.getItem(KEY); if (j) { const o = JSON.parse(j); if (o && o.v === 1) return o; } } catch (e) {}
  return { v: 1, th: {} };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function ts(id) { return S.th[id] || (S.th[id] = { a: {}, done: {} }); }
function thById(id) { return DATA.find(t => t.id === id); }
function taskMax(t) { return t.type === "tfn" ? t.items.length : t.type === "match" ? t.pairs.length : 1; }
function thMax(th) { return th.tasks.reduce((n, t) => n + taskMax(t), 0); }
function thScore(th) { return Object.values(ts(th.id).done).reduce((n, v) => n + v, 0); }
function thCount(th) { return Object.keys(ts(th.id).done).length; }
function thDone(th) { return th.tasks.every(t => ts(th.id).done[t.id] !== undefined); }

function shuffle(n, avoidIdentity) {
  const a = [...Array(n).keys()];
  let tries = 0;
  do {
    for (let i = n - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    tries++;
  } while (avoidIdentity && a.every((v, i) => v === i) && tries < 20);
  return a;
}
function ensure(th, t) {
  const A = ts(th.id).a;
  if (A[t.id] === undefined) {
    if (t.type === "mc") A[t.id] = { sel: null, perm: shuffle(t.options.length) };
    else if (t.type === "tfn") A[t.id] = t.items.map(() => null);
    else if (t.type === "order") A[t.id] = shuffle(t.items.length, true);
    else A[t.id] = { sel: t.pairs.map(() => null), opts: shuffle(t.pairs.length, true) };
  }
  return A[t.id];
}
function evLabel(ev) {
  const p = ev.map(n => n + ".");
  const s = p.length > 1 ? p.slice(0, -1).join(", ") + " és " + p[p.length - 1] : p[0];
  return s + " mondat";
}
function evBtn(ev) {
  return ev && ev.length ? `<button type="button" class="btn ghost sm" data-act="show" data-ev="${ev.join(",")}">Mutasd a szövegben (${evLabel(ev)})</button>` : "";
}

/* ---------- kezdőlap ---------- */
function rankFor(r) { return r >= 0.9 ? "Mestertörténész" : r >= 0.7 ? "Haladó történész" : r >= 0.5 ? "Gyakorló történész" : "Kezdő történész"; }

function compStats() {
  const m = {};
  DATA.forEach(th => {
    const d = ts(th.id).done;
    th.tasks.forEach(t => {
      if (d[t.id] === undefined) return;
      const o = m[t.comp] || (m[t.comp] = { g: 0, m: 0 });
      o.g += d[t.id]; o.m += taskMax(t);
    });
  });
  return m;
}

function renderHome() {
  const total = DATA.reduce((n, t) => n + thMax(t), 0);
  const got = DATA.reduce((n, t) => n + thScore(t), 0);
  const finished = DATA.filter(thDone).length;
  const any = DATA.some(t => thCount(t) > 0);
  const cs = compStats();
  const status = finished === DATA.length
    ? `Mind az öt hadszíntér kész. Címed: <b>${rankFor(got / total)}</b>.`
    : `Kész hadszíntér: ${finished} / ${DATA.length}.`;

  app.innerHTML = `

    <div class="step"><b>3. Nézd meg a magyarázatot</b><span>Ellenőrzés után a program megmutatja, melyik mondat adja a választ.</span></div>
  </div>
  <section class="panel" aria-labelledby="sc">
    <div class="score-row"><h2 id="sc">Összpontszám</h2><span class="score-big">${got} / ${total}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${got}" aria-label="Összpontszám"><i style="width:${Math.round(got / total * 100)}%"></i></div>
    <p class="lead" style="margin-top:10px;font-size:.95rem">${status}</p>
  </section>
  <div class="grid">
    ${DATA.map(th => {
      const c = thCount(th), mx = thMax(th), sc = thScore(th), n = th.tasks.length;

      return `<article class="tcard" style="--h:${th.hue}">

        <p class="bl">${th.blurb}</p>
        <div class="st"><span>Feladat: ${c} / ${n}</span><span>${sc} / ${mx} pont</span></div>

        <button type="button" class="btn" data-open="${th.id}" aria-label="${label}: ${th.title}">${label}</button>
      </article>`;
    }).join("")}
  </div>
  ${any ? `<section class="panel" aria-labelledby="cp">
    <h2 id="cp">Mit gyakoroltál eddig?</h2>
    <div class="comp">${COMPS.filter(c => cs[c]).map(c => {
      const o = cs[c], p = Math.round(o.g / o.m * 100);
      return `<div class="row"><span>${c}</span><span class="n">${o.g} / ${o.m} pont</span><div class="bar" aria-hidden="true"><i style="width:${p}%"></i></div></div>`;
    }).join("")}</div>
  </section>` : ""}
  <div class="foot">
    <span>A második világháború emberek millióinak életét törte meg. A feladatok a történelmi események megértését szolgálják.</span>
    ${any ? `<button type="button" class="btn ghost sm" data-act="reset-all">${armed ? "Biztosan törlöd? Kattints még egyszer" : "Összes eredmény törlése"}</button>` : ""}
  </div>`;
  window.scrollTo(0, 0);
}

  const th = thById(id);
  let n = 0;
  const paras = th.text.map(p => `<p>${p.map(s => { n++; return `<span class="sent" id="s${n}"><sup class="sn">${n}</sup> ${s} </span>`; }).join("")}</p>`).join("");
  app.innerHTML = `
  <div class="topbar">
    <button type="button" class="btn ghost" data-act="home">← Térkép</button>
    <div class="meta" id="meta"></div>
  </div>
  <header class="thead2">
    <p class="eyebrow">${th.period}</p>
    <h2 id="ttl" tabindex="-1">${th.title}</h2>
  </header>
  <p class="notice">Csak a szöveg alapján válaszolj. Ha valamit a szöveg nem említ, akkor is „nem derül ki a szövegből” a helyes válasz, akár tudod az igazságot, akár nem.</p>
  <div class="split">
    <aside class="reading" aria-label="Olvasmány">
      <h3>Olvasmány</h3>
      ${paras}
      <details class="gloss"><summary>Szójegyzék</summary>
        <dl>${th.glossary.map(g => `<dt>${g[0]}</dt><dd>${g[1]}</dd>`).join("")}</dl>
      </details>
    </aside>
    <div id="tasks">${th.tasks.map(t => taskHTML(th, t)).join("")}</div>
  </div>
  <div id="result" aria-live="polite"></div>`;
  updateMeta(th);
  window.scrollTo(0, 0);
  const h = $("#ttl"); if (h) h.focus({ preventScroll: true });
}

function taskTitle(t) {
  if (t.type === "mc") return t.q;
  if (t.type === "tfn") return "Igaz, hamis, vagy nem derül ki a szövegből? Dönts minden állításról!";
  if (t.type === "order") return "Állítsd időrendbe az eseményeket! A nyilakkal mozgathatod őket.";
  return "Mi mit okozott? Válaszd ki minden eseményhez a hozzá tartozó következményt!";
}

function mcBody(t, a, done) {
  return `<fieldset class="opts" ${done ? "disabled" : ""}><legend class="sr">Válaszlehetőségek</legend>${a.perm.map(i => {
    const checked = a.sel === i; let cls = "opt", mk = "";
    if (done) {
      if (i === t.correct) { cls += " ok"; mk = '<b class="mk">✓ helyes</b>'; }
      else if (checked) { cls += " bad"; mk = '<b class="mk">✗ a te válaszod</b>'; }
    }
    return `<label class="${cls}"><input type="radio" name="${t.id}" value="${i}" data-t="${t.id}" ${checked ? "checked" : ""}><span>${t.options[i]}</span>${mk}</label>`;
  }).join("")}</fieldset>`;
}
function tfBody(t, a, done) {
  return t.items.map((it, k) => `<div class="tf"><p>${it.s}</p><div class="tfopts" role="radiogroup" aria-label="${it.s}">${TF.map((lab, j) => {
    const sel = a[k] === j; let cls = "pill", mk = "";
    if (done) {
      if (j === it.a) { cls += " ok"; mk = '<b class="mk">✓</b>'; }
      else if (sel) { cls += " bad"; mk = '<b class="mk">✗</b>'; }
    }
    return `<label class="${cls}"><input type="radio" name="${t.id}-${k}" value="${j}" data-t="${t.id}" data-k="${k}" ${sel ? "checked" : ""} ${done ? "disabled" : ""}><span>${lab}</span>${mk}</label>`;
  }).join("")}</div></div>`).join("");
}
function orderBody(t, a, done) {
  return `<ol class="ord">${a.map((idx, pos) => {
    const it = t.items[idx]; let cls = "oi", extra = "";
    if (done) { cls += idx === pos ? " ok" : " bad"; extra = `<span class="when">${idx === pos ? "✓ jó helyen" : "✗ nem ide tartozik"} · ${it.when}</span>`; }
    const btns = done ? "" : `<span class="mv">
      <button type="button" class="ib" data-act="up" data-t="${t.id}" data-i="${pos}" aria-label="Egy hellyel feljebb: ${it.t}" ${pos === 0 ? "disabled" : ""}>▲</button>
      <button type="button" class="ib" data-act="down" data-t="${t.id}" data-i="${pos}" aria-label="Egy hellyel lejjebb: ${it.t}" ${pos === a.length - 1 ? "disabled" : ""}>▼</button></span>`;
    return `<li class="${cls}"><span>${it.t}</span>${btns}${extra}</li>`;
  }).join("")}</ol>`;
}
function matchBody(t, a, done) {
  return t.pairs.map((p, k) => {
    const v = a.sel[k]; let cls = "mrow", ans = "";
    if (done) {
      if (v === k) { cls += " ok"; ans = '<span class="ans">✓ helyes</span>'; }
      else { cls += " bad"; ans = `<span class="ans">✗ Helyesen: <em>${p.e}</em></span>`; }
    }
    return `<div class="${cls}"><label for="m-${t.id}-${k}">${p.c}</label>
      <select id="m-${t.id}-${k}" data-t="${t.id}" data-k="${k}" ${done ? "disabled" : ""}>
        <option value="">Válassz…</option>
        ${a.opts.map(j => `<option value="${j}" ${v === j ? "selected" : ""}>${t.pairs[j].e}</option>`).join("")}
      </select>${ans}</div>`;
  }).join("");
}

function feedback(th, t, a) {
  if (t.type === "mc") {
    const ok = a.sel === t.correct;
    return `<p class="fbh ${ok ? "ok" : "bad"}">${ok ? "✓ Helyes!" : "✗ Nem egészen."}</p><p>${t.why}</p>${evBtn(t.ev)}`;
  }
  if (t.type === "tfn") {
    const n = t.items.filter((it, k) => a[k] === it.a).length;
    return `<p class="fbh ${n === t.items.length ? "ok" : "bad"}">${n} / ${t.items.length} állítást találtál el.</p>
      <ul class="fl nolist">${t.items.map((it, k) => {
        const ok = a[k] === it.a;
        return `<li><b>${ok ? "✓" : "✗"}</b> ${it.s}<br><em>Helyes válasz: ${TF[it.a]}.</em> ${it.why}<br>${evBtn(it.ev)}</li>`;
      }).join("")}</ul>`;
  }
  if (t.type === "order") {
    const ok = a.every((idx, pos) => idx === pos);
    return `<p class="fbh ${ok ? "ok" : "bad"}">${ok ? "✓ Tökéletes időrend!" : "✗ Nem minden esemény került a helyére."}</p>
      <p>A helyes sorrend az időpontokkal:</p>
      <ol class="fl">${t.items.map(it => `<li>${it.t} <span class="when">(${it.when})</span></li>`).join("")}</ol>
      ${ok ? "" : "<p>Tipp: keresd meg a szövegben az évszámokat, és állítsd őket sorba.</p>"}${evBtn(t.ev)}`;
  }
  const n = t.pairs.filter((p, k) => a.sel[k] === k).length;
  return `<p class="fbh ${n === t.pairs.length ? "ok" : "bad"}">${n} / ${t.pairs.length} párt találtál el.</p>
    <ul class="fl nolist">${t.pairs.map((p, k) => `<li><b>${a.sel[k] === k ? "✓" : "✗"}</b> ${p.c} → <em>${p.e}</em><br>${evBtn(p.ev)}</li>`).join("")}</ul>`;
}

function taskHTML(th, t) {
  const st = ts(th.id), a = ensure(th, t), done = st.done[t.id] !== undefined, mx = taskMax(t);
  let body = "";
  if (t.type === "mc") body = mcBody(t, a, done);
  else if (t.type === "tfn") body = tfBody(t, a, done);
  else if (t.type === "order") body = orderBody(t, a, done);
  else body = matchBody(t, a, done);
  return `<section class="task ${done ? "done" : ""}" id="card-${t.id}">
    <div class="th"><span class="chip">${t.comp}</span><span class="pts">${done ? st.done[t.id] + " / " + mx + " pont" : mx + " pont"}</span></div>
    <h3 class="q">${taskTitle(t)}</h3>
    ${body}
    <div class="act">${done ? "" : `<button type="button" class="btn" data-act="check" data-t="${t.id}">Ellenőrzés</button><span class="warn" id="w-${t.id}" role="status"></span>`}</div>
    <div class="fb" tabindex="-1" aria-live="polite">${done ? feedback(th, t, a) : ""}</div>
  </section>`;
}

function redraw(th, t) { const old = $("#card-" + t.id); if (old) old.outerHTML = taskHTML(th, t); }

function check(th, t) {
  const st = ts(th.id), a = st.a[t.id];
  let pts = 0, warn = "";
  if (t.type === "mc") { if (a.sel === null) warn = "Válassz egy választ!"; else pts = a.sel === t.correct ? 1 : 0; }
  else if (t.type === "tfn") { if (a.some(x => x === null)) warn = "Minden állításról dönts!"; else pts = t.items.reduce((n, it, k) => n + (a[k] === it.a ? 1 : 0), 0); }
  else if (t.type === "order") { pts = a.every((idx, pos) => idx === pos) ? 1 : 0; }
  else { if (a.sel.some(x => x === null)) warn = "Minden sorban válassz!"; else pts = t.pairs.reduce((n, p, k) => n + (a.sel[k] === k ? 1 : 0), 0); }
  if (warn) { $("#w-" + t.id).textContent = warn; return; }
  st.done[t.id] = pts; save();
  redraw(th, t); updateMeta(th);
  const fb = $("#card-" + t.id + " .fb"); if (fb) fb.focus({ preventScroll: false });
}

function move(th, t, i, dir) {
  const a = ts(th.id).a[t.id], j = i + dir;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]]; save(); redraw(th, t);
  const same = $(`#card-${t.id} [data-act="${dir < 0 ? "up" : "down"}"][data-i="${j}"]`);
  const other = $(`#card-${t.id} [data-act="${dir < 0 ? "down" : "up"}"][data-i="${j}"]`);
  const target = same && !same.disabled ? same : other;
  if (target) target.focus({ preventScroll: true });
}

function updateMeta(th) {
  $("#meta").innerHTML = `Pontszám: <b>${thScore(th)}</b> / ${thMax(th)}`;
  const r = $("#result");
  if (!thDone(th)) { r.innerHTML = ""; return; }
  const sc = thScore(th), mx = thMax(th), q = sc / mx;
  const msg = q >= 0.85 ? "Kiváló munka!" : q >= 0.6 ? "Jó eredmény. Nézd át újra a hibás feladatok magyarázatát." : "Olvasd el újra a szöveget, és próbáld meg még egyszer.";
  r.innerHTML = `<section class="result"><h3>Kész a hadszíntér: ${sc} / ${mx} pont</h3><p>${msg}</p>
    <div class="ra"><button type="button" class="btn" data-act="next">Következő hadszíntér →</button>
    <button type="button" class="btn ghost" data-act="home">Térkép</button>
    <button type="button" class="btn ghost" data-act="reset-th">Újrapróbálom</button></div></section>`;
}

function show(s) {
  document.querySelectorAll(".sent.hl").forEach(x => x.classList.remove("hl"));
  const ids = s.split(",").map(Number);
  ids.forEach(n => { const e = $("#s" + n); if (e) e.classList.add("hl"); });
  const f = $("#s" + ids[0]);
  if (f) f.scrollIntoView({ block: "center", behavior: reduce ? "auto" : "smooth" });
}

function go(id) { view = id; armed = false; id ? renderTheater(id) : renderHome(); }

app.addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-open]");
  if (!b) return;
  if (b.dataset.open) { go(b.dataset.open); return; }
  const act = b.dataset.act, th = view ? thById(view) : null;
  if (act === "home") go(null);
  else if (act === "check") check(th, th.tasks.find(t => t.id === b.dataset.t));
  else if (act === "up" || act === "down") move(th, th.tasks.find(t => t.id === b.dataset.t), +b.dataset.i, act === "up" ? -1 : 1);
  else if (act === "show") show(b.dataset.ev);
  else if (act === "next") {
    const i = DATA.indexOf(th);
    let nx = null;
    for (let k = 1; k <= DATA.length; k++) { const c = DATA[(i + k) % DATA.length]; if (!thDone(c)) { nx = c.id; break; } }
    go(nx);
  }
  else if (act === "reset-th") { delete S.th[th.id]; save(); go(th.id); }
  else if (act === "reset-all") {
    if (!armed) { armed = true; b.textContent = "Biztosan törlöd? Kattints még egyszer"; return; }
    S = { v: 1, th: {} }; save(); armed = false; renderHome();
  }
});

app.addEventListener("change", e => {
  const t = e.target;
  if (!t.dataset || !t.dataset.t || !view) return;
  const th = thById(view), task = th.tasks.find(x => x.id === t.dataset.t);
  if (!task) return;
  const a = ts(th.id).a[task.id];
  if (t.matches('input[type="radio"]')) {
    if (task.type === "mc") a.sel = +t.value;
    else if (task.type === "tfn") a[+t.dataset.k] = +t.value;
  } else if (t.matches("select")) {
    a.sel[+t.dataset.k] = t.value === "" ? null : +t.value;
  }
  const w = $("#w-" + task.id); if (w) w.textContent = "";
  save();
});

renderHome();
</script>

</body></html>
